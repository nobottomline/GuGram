name: 🐞 Bug report
description: Report errors or unexpected behavior.
labels: [bug]
body:
  - type: textarea
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. 
        2. 
        3. 
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected behaviour
      placeholder: Tell us what should happen
    validations:
      required: true
  - type: textarea
    attributes:
      label: Actual behaviour
      placeholder: Tell us what happens instead
    validations:
      required: true
  - type: input
    attributes:
      label: Operating system
      description: |
        Write exact OS (e.g. Windows 11, macOS 14, Ubuntu 24.04 GNOME).
        * 🛑 NO KERNEL VERSIONS (uname)
    validations:
      required: true
  - type: input
    attributes:
      label: GuGram version or commit
      description: |
        Include the exact version and, for source builds, the commit hash.
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Installation source
      multiple: false
      options:
        - Built from GuGram source
        - Local macOS installer
        - Other source
    validations:
      required: true
  - type: textarea
    attributes:
      label: Logs
      description: >
        Type the word `viewlogs`
        [directly into your settings menu](https://github.com/telegramdesktop/tdesktop/wiki/Cheat-Codes)
        to open the logs folder.
      placeholder: Paste relevant diagnostics after removing personal data, credentials, and proxy secrets.
      render: shell
